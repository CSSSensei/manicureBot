[project]
name = "manicure-bot"
version = "0.1.0"
description = "Telegram bot for manicure appointment management @Nude_n_red_bot"
requires-python = ">=3.10"
dependencies = [
    "aiofiles==23.2.1",
    "aiogram==3.4.0",
    "aiohttp==3.9.5",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "APScheduler==3.11.0",
    "attrs==25.3.0",
    "certifi==2025.7.14",
    "frozenlist==1.7.0",
    "idna==3.10",
    "magic-filter==1.0.12",
    "multidict==6.6.3",
    "propcache==0.3.2",
    "pydantic==2.5.3",
    "pydantic-core==2.14.6",
    "python-dotenv==1.1.1",
    "PyYAML==6.0.2",
    "typing-extensions==4.14.1",
    "yarl==1.20.1",
    "pytest~=8.4.1",
    "colorlog~=6.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[dependency-groups]
dev = []

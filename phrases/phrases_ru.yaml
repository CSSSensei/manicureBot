    service_update: "<b>Подтвердите обновление услуги</b>\n\n{service}"
    service_update_successfully: "<b>✅ Услуга обновлена и уже активна!</b>\n\n{service}"
    service_added_successfully: "<b>✅ Услуга добавлена успешно</b>\n\n{service}"
    edit_service: "<b>Текущие услуги</b>\n\nВыберите услугу для редактирования"
    add_service: |
      Отправьте текст в формате:
      <code>Название услуги
      о: описание (опционально)
      с: стоимость (опционально)
      д: длительность в минутах (опционально)</code>
    add_slots_menu: "<b>Добавление слотов</b>\n\n{schedule}\n\nВыберите месяц для автоматического добавления слотов или добавьте слоты вручную"
    add_manual_slot: |
      <b>Добавление слотов</b>
      
      Отправьте текст в формате:
      {slot_format}
    choose_date_to_delete: | 
      <b>{month}</b>
      <i>доступно слотов: {len_slots}</i>
      
      Выберите день для удаления слота
    no_available_slots: |
      <b>{month}</b>
      <i>доступных слотов нет</i>
    choose_slot_to_delete: |
      <b>Удаление слота</b>
      Дата: <i>{date}</i>
      
      Выберите слот
    slot_info: | 
      <b>Подтвердите удаление слота</b>
      Дата: <i>{date}</i>
      
      {slot_str}
    delete_all_slots: |
      <b>Подтвердите удаление всех слотов</b>
      Дата: <i>{date}</i>
    month: "<b>{month}</b>\n"
    no_appointments: "<i>записи отсутствуют</i> (╥_╥)\n"
    future_appointments: "<i>запланировано встреч: {len_slots}</i>\n"
    past_appointment: "<i>отработано слотов: {len_slots}</i>\n"
    choose_appointment_date: "\nВыберите день для просмотра записи <i>(точкой отмечены запланированные и прошедшие встречи)</i>"
    service_format: |
      Формат ввода:
      <code>Название услуги
      о: описание (не обязательно)
      с: стоимость (не обязательно)
      д: длительность в минутах (не обязательно)</code>

      Пример:
      <code>Маникюр
      о: Классический маникюр
      с: 1500
      д: 60</code>
    slot_format: |
      <pre>сентябрь
      1 - 14:30-16:30 17:30-19:30
      2 - 10:00 15:00</pre>
      
      • Первая строка — месяц
      • Число — времена через пробел
      • Одно время = слот на 3 часа
    send_slot_schedule: |
      <b>Изменение расписания</b>
      <i>Отправьте расписание недели в следующем формате</i>
      <pre>пн - 10:00 14:00-18:00 18:00
      вт - выходной
      ср - 11:00 14:30 18:00
      чт - 15:00 18:00
      пт - 15:00 18:00
      сб - выходной
      вс - 11:00 14:00 17:00</pre>
      
      • Начало строки — <b>день недели</b> (пн, вт, ср, чт, пт, сб, вс).
      • После <code>`-`</code> указывайте рабочее время:
          • <code>10:00</code>  — один слот (по умолчанию считается на <b>3 часа</b>).
          • <code>14:00-18:00</code> — интервал, мастер работает с <b>14:00 до 18:00</b>.
      • Если день <b>не указан</b> в сообщении — считается <b>выходным</b>.
      • Можно указать <b>несколько слотов через пробел</b>:<pre>пт - 09:00 14:00-16:00</pre>
      • Чтобы явно указать выходной, напишите:<pre>вс - выходной</pre>


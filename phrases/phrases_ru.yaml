  no_available_slots: "На <i>{month}</i> <b>нет</b> доступных слотов (._.)"
  choose_service: "Выберите услугу"
  send_photo: |
    <b>Отсылка фото</b>
    <i>Если это Ваша первая запись, пришлите фото текущего состояния ногтей. Также Вы можете прислать фото-референсы маникюра</i>
    
    Для продолжения нажмите <i>«Далее»</i>
  booking_canceled: "Вы отменили запись"
  send_comment: |
    <b>Отсылка комментария</b>
    <i>Если у Вас есть комментарии или пожелания для мастера, напишите их в отдельном сообщении</i>
    
    Для продолжения нажмите <i>«Далее»</i>
  confirm: "Проверьте информацию и подтвердите запись"
  confirmation_wait: "<b>⏳ Заявка зарегистрирована. Ожидайте подтверждения записи мастером</b>"
  no_apps_today: "На сегодня встреч не назначено"
  no_active_bookings: |
    У Вас сейчас нет активных записей
    
    Но это легко исправить! Просто нажмите кнопку «{booking}»
  notify:
    client:
      scheduled: |
        <b>🔔 Напоминание: {time_left}</b>

        Отменить запись можно в меню «Мои записи»
      confirmed: "✅ Запись от <i>{date} {slot_time}</i> подтверждена мастером"
      rejected: "❌ Запись от <i>{date} {slot_time}</i> отклонена\n\n<b>Для дополнительной информации обратитесь к мастеру\n<a href=\"tg://user?id={master_id}\">{master_username}</a></b>"
      cancelled: "❌ Запись от <i>{date} {slot_time}</i> отменена\n\n<b>Для дополнительной информации обратитесь к мастеру\n<a href=\"tg://user?id={master_id}\">{master_username}</a></b>"
    master:
      cancelled: |
        ❌ Пользователь <b><a href="tg://user?id={user_id}">{username}</a></b> отменил(-а) запись
        Слот: <i>{date} {slot_time}</i>

  status:
    pending: "⏳ Ожидает подтверждения"
    confirmed: "✅ Подтверждено"
    completed: "Выполнено"
    cancelled: "🗑 Отменено"
    rejected: "🚫 Отклонено"
    already_rejected: "Ничего не произошло, потому что запись уже отклонена"
    already_cancelled: "Запись уже была отменена пользователем"
    cancelled_by_master: |
      Запись отменена, уже оповестили об этом клиента
      
      <b>Внимание: слот теперь доступен для брони</b>
      Если хотите удалить слот: Меню → Удалить слоты → Дата → Время
  master:
    no_pending_apps: "На данный момент записей в ожидании нет"
    menu: |
      <b>Общая статистика</b>
      
      👥 Клиентов: {clients}
      📅 Завершённых записей: {appointments}
    service_editor: "<b>Редактор услуг</b>\n\nИзменить существующие услуги или добавить новые"
    edit_service: "<b>Текущие услуги</b>\n\nВыберите услугу для редактирования"
    add_service: |
      Отправьте текст в формате:
      <code>Название услуги
      о: описание (опционально)
      с: стоимость (опционально)
      д: длительность в минутах (опционально)</code>
    add_slots_menu: "<b>Добавление слотов</b>\n\nВыберите месяц для автоматического добавления слотов или добавьте слоты вручную"
    add_manual_slot: |
      <b>Добавление слотов</b>
      
      Отправьте текст в формате:
      <code>сентябрь
      1 - 14:30-17:30 18:00-21:00
      2 - 10:00 15:00</code>
      
      Где:
      - Первая строка - месяц
      - Каждая следующая строка: число - времена
      - Если указано одно время (10:00) - слот на 3 часа
    choose_date_to_delete: | 
      <b>{month}</b>
      <i>доступно слотов: {len_slots}</i>
      
      Выберите день для удаления слота
    no_available_slots: |
      <b>{month}</b>
      <i>доступных слотов нет</i>
    choose_slot_to_delete: |
      <b>Удаление слота</b>
      Дата: <i>{date}</i>
      
      Выберите слот
    slot_info: | 
      <b>Подтвердите удаление слота</b>
      Дата: <i>{date}</i>
      
      {slot_str}
    month: "<b>{month}</b>\n"
    no_appointments: "<i>записи отсутствуют</i> (╥_╥)\n"
    future_appointments: "<i>запланировано встреч: {len_slots}</i>\n"
    past_appointment: "<i>отработано слотов: {len_slots}</i>\n"
    choose_appointment_date: "\nВыберите день для просмотра записи <i>(точкой отмечены запланированные и прошедшие встречи)</i>"



commands:
  start: |
    Привет! Здесь ты можешь записаться на маникюр в <a href='https://t.me/nude_n_red'>nails.simple</a> — тыкай кнопку <i>«{booking}»</i>
    
    Как пользоваться ботом /help
    Все доступные команды /commands
  help: |
    Нажми кнопку <i>«{booking}»</i> и следуй инструкциям в сообщениях.
    
    Запись проходит по цепочке:
    1. Выбор слота
    2. Услуга 
    3. Загрузка фото
    4. Комментарий
    
    <b>Для уточнения деталей пиши мастеру
    <a href="tg://user?id={master_id}">{master_username}</a></b>
  about: |
    Продакшн <b><a href="https://t.me/phasalo">Phasalo</a></b>
    Дизайн <b><a href="https://t.me/kfprod">KFproduction</a></b>
    Возникли трудности → <b><a href="tg://user?id=972753303">ответственный за безобразие</a></b>

    2025

answer:
  unknown:
    - "Я тебя не понимаю…"
    - "Я не понимаю, о чем ты"
    - "Что ты имеешь в виду? 🧐"
    - "Я в замешательстве 🤨"
    - "Не улавливаю смысла 🙃"
    - "Что ты пытаешься сказать❓"
    - "Не понимаю твоего сообщения 😕"
    - "🤷‍♂️ Не понимаю 🤷‍♀️"

  choose_date: "Выберите день для записи. Доступные дни отмечены точкой"
  photo_attached: "✅ Фото прикреплено!"
  comment_attached: "✅ Комментарий прикреплён"
  choose_slot: "<b>📅 Дата: </b><i>{date}</i>\n\nВыберите время"

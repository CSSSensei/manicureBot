    no_pending_apps: "Записей в ожидании пока нет 🌸"
    menu: |
      <b>Общая статистика</b>
      
      👥 Клиентов: {clients}
      📅 Завершённых записей: {appointments}
    service_editor: "<b>Редактор услуг</b>\n\nИзменить существующие услуги или добавить новые"

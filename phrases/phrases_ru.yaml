commands:
  start: |
    Привет! Здесь ты можешь записаться на маникюр в <a href='https://t.me/nude_n_red'>Nude'n'Red Nails</a>!
    Чтобы начать, просто нажми кнопку <i>«{booking}»</i> 👇
    
    Если что-то непонятно — пиши /help, я всё расскажу
    Все доступные команды /commands
  help: |
    <b>Как здесь всё устроено?</b>
    Я помогу тебе записаться всего за 4 простых шага:
    
    1. Выбери услугу — посмотри список и найди то, что нужно именно тебе
    2. Подбери удобное время — свободные слоты показываются в реальном времени
    3. Загрузи фото — можно показать свои ноготки или картинку с дизайном мечты
    4. Оставь комментарий — укажи все важные нюансы для мастера
    
    <i>Если что-то пойдёт не так или захочешь уточнить — пиши мастеру напрямую:
    <a href="tg://user?id={master_id}">{master_username}</a></i>
  about: |
    Продакшн <b><a href="https://t.me/phasalo">Phasalo</a></b>
    Дизайн <b><a href="https://t.me/kfprod">KFproduction</a></b>
    Возникли трудности → <b><a href="tg://user?id=972753303">ответственный за безобразие</a></b>

    2025

